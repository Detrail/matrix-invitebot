[package]
name = "invite-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
matrix-sdk = { version = "0.19", features = ["sqlite", "e2e-encryption"] }
matrix-sdk-sqlite = { version = "0.19", features = ["bundled"] }
matrix-sdk-crypto = "0.19"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing-subscriber = "0.3"
dotenvy = "0.15"